services:
  # UCM Integration Service
  ucm:
    build:
      context: .
      dockerfile: Dockerfile  # Using main Dockerfile for UCM
    ports:
      - "8083:8080"  # UCM service (changed from 8080 to 8083)
    environment:
      - ISS_ENDPOINT=http://cali-x-one:8003
    networks:
      - caleon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - cali-x-one

  # Enhanced Cali X One Core with SKG Intelligence
  cali-x-one:
    build: .
    ports: 
      - "8006:8003"  # Main service (changed from 8003 to 8006)
    environment:
      - PYTHONPATH=/app:/app/skg-core
      - SKG_DB_PATH=/app/data/skg.db
      - CALEON_ENV=production
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ./seed_vault:/app/seed_vault:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - caleon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "iss_module.api.api:app", "--host", "0.0.0.0", "--port", "8003"]

  # DALS (Digital Asset Logistics System) — SEPARATE SERVICE
  dals:
    build: .
    ports: 
      - "8007:8003"  # DALS service
    environment:
      - PYTHONPATH=/app:/app/skg-core
      - SKG_DB_PATH=/app/data/skg.db
      - CALEON_ENV=production
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ./seed_vault:/app/seed_vault:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - caleon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "iss_module.api.api:app", "--host", "0.0.0.0", "--port", "8003"]
    depends_on:
      - cali-x-one

  # SKG API Service for direct knowledge graph operations
  skg-service:
    build: .
    ports:
      - "8004:8004"  # SKG service
    environment:
      - PYTHONPATH=/app:/app/skg-core
      - SKG_DB_PATH=/app/data/skg.db
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - caleon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: ["python", "/app/skg-core/skg_api.py"]
    depends_on:
      - cali-x-one

